name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Static export cannot include Next.js API routes — PHP handles forms on Hostinger.
      - run: rm -rf app/api

      - run: npm run build

      - name: Validate FTP server hostname
        run: |
          SERVER="${{ secrets.FTP_SERVER }}"
          if [ -z "$SERVER" ]; then
            echo "::error::FTP_SERVER secret is missing. Add it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi
          if echo "$SERVER" | grep -qE '^(ftp|ftps)://'; then
            echo "::error::FTP_SERVER must be hostname only (no ftp:// prefix). Example: ftp.mystudyhive.co.uk"
            exit 1
          fi
          if echo "$SERVER" | grep -q '/'; then
            echo "::error::FTP_SERVER must not include a path. Use only the hostname."
            exit 1
          fi

      - name: Remove stale FTP sync state
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}"
          rm -f public_html/.ftp-deploy-sync-state.json
          rm -f .ftp-deploy-sync-state.json
          bye
          EOF

      - name: FTP deploy to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ./public_html/
          # Keep server-only api/config.php across deploys
          exclude: |
            **/api/config.php
